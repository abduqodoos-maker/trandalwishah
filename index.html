<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترند شوب - متجرك الإلكتروني</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .category-btn.active {
            background-color: #4f46e5;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 flex flex-col min-h-screen">

    <!-- شريط التنقل العلوي -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse cursor-pointer">
                <span class="bg-indigo-600 text-white p-2 rounded-lg font-black text-xl"><i class="fa-solid fa-store"></i></span>
                <h1 class="text-2xl font-black tracking-wider text-indigo-400">ترند شوب</h1>
            </div>
            <nav class="hidden md:flex space-x-6 space-x-reverse font-semibold items-center">
                <button class="hover:text-indigo-400 transition bg-transparent border-none cursor-pointer text-white font-semibold">الرئيسية</button>
                <a href="https://wa.me/967771558887" target="_blank" class="hover:text-emerald-400 transition text-white font-semibold flex items-center">
                    <i class="fa-brands fa-whatsapp text-emerald-400 ml-1"></i> تواصل معنا
                </a>
            </nav>
            <div class="flex items-center space-x-4 space-x-reverse">
                <button class="relative bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg transition">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-indigo-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <div id="store-view" class="space-y-8">
            <!-- قسم الترحيب -->
            <div class="bg-gradient-to-r from-indigo-700 to-slate-900 rounded-2xl p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-center">
                <div class="space-y-3 mb-6 md:mb-0">
                    <span class="bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 text-xs px-3 py-1 rounded-full font-bold">تسوق بالريال اليمني</span>
                    <h2 class="text-3xl md:text-4xl font-black">أفضل المنتجات وأحدث الصيحات في اليمن</h2>
                    <p class="text-slate-300 max-w-xl text-sm md:text-base">تصفح منتجاتنا المميزة واطلب مباشرة عبر الواتساب وسنصلك أينما كنت.</p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button class="bg-indigo-600 text-white font-bold px-6 py-3 rounded-xl shadow hover:bg-indigo-700 transition">تصفح المنتجات</button>
                    <a href="https://wa.me/967771558887" target="_blank" class="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl shadow hover:bg-emerald-700 transition flex items-center justify-center">
                        <i class="fa-brands fa-whatsapp text-xl ml-2"></i> تواصل مباشر
                    </a>
                </div>
            </div>

            <!-- قسم المنتجات -->
            <div id="products-section" class="space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl border shadow-sm">
                    <div id="categories-container" class="flex flex-wrap gap-2 w-full md:w-auto">
                        <button class="category-btn active px-4 py-2 rounded-xl text-sm font-bold transition">الكل</button>
                    </div>
                    <div class="w-full md:w-64">
                        <input type="text" id="search-input" placeholder="ابحث عن منتج..." class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50">
                    </div>
                </div>

                <!-- شبكة المنتجات المحدثة تلقائياً -->
                <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- تم توليد منتج تجريبي للتأكد من عمل الصفحة -->
                    <div class="bg-white rounded-2xl border shadow-sm overflow-hidden flex flex-col justify-between p-4">
                        <div class="h-48 bg-slate-100 rounded-xl mb-4 flex items-center justify-center text-slate-400">
                            <i class="fa-solid fa-image text-4xl"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 mb-1">منتج تجريبي (مثال)</h3>
                            <p class="text-indigo-600 font-black mb-3">15,000 ر.ي</p>
                        </div>
                        <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl transition text-sm">أضف للسلة</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center border-t border-slate-800 text-sm">
        <p>&copy; 2026 ترند شوب. جميع الحقوق محفوظة.</p>
    </footer>
</body>
</html>
